name: Journeys

# Nightly "AI user" journeys (tests/journeys). Failures become deduplicated
# `bot:journey` issues with no AI involved. Contract:
# https://github.com/nitsuah/.github/blob/main/journeys/STANDARD.md

on:
  schedule:
    - cron: '37 7 * * *' # pick a minute that doesn't collide with other nightlies
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/journeys/**'
      - 'playwright.journeys.config.ts'
      - '.github/workflows/journeys.yml'
      - 'e2e/fixtures/**'

permissions:
  contents: write # bot/journeys branch only (BUGS.md, metrics, failure screenshots)
  issues: write

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    uses: nitsuah/.github/.github/workflows/journeys.yml@main
    with:
      # Keep in step with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      command: npm run test:journeys
      features: promo/spots.json
      repro: |
        docker run --rm -v "$PWD:/w" -w /w -e CI=true mcr.microsoft.com/playwright:v1.63.0-jammy \
          sh -c "npm ci && npm run test:journeys"
