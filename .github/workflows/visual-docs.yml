name: Visual docs

# Regenerates README screenshots (DB-free Playwright suite, e2e/visual-docs) and
# architecture diagrams (docs/diagrams/*.mmd -> .svg), rewrites the README's
# visual-docs block, and opens/updates a PR on bot/visual-docs. Never pushes to
# main. Recipe and reuse in other repos: docs/VISUAL_DOCS.md.
#
# One-time repo setting: Settings -> Actions -> General -> "Allow GitHub Actions
# to create and approve pull requests". PRs opened with GITHUB_TOKEN don't
# trigger other workflows; the change is docs-only, so that's acceptable.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'docs/diagrams/**'
      - 'e2e/visual-docs/**'
      - 'playwright.visual-docs.config.ts'
      - 'scripts/visual-docs-readme.mjs'
      - '.github/workflows/visual-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-docs
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: npx playwright test -c playwright.visual-docs.config.ts
        env:
          CI: true

      - name: Render diagrams
        # mermaid-cli drives Chromium through Puppeteer; reuse Playwright's
        # browser instead of downloading a second one.
        run: |
          CHROME=$(node -p "require('playwright-core').chromium.executablePath()")
          printf '{"executablePath":"%s","args":["--no-sandbox"]}' "$CHROME" > "$RUNNER_TEMP/puppeteer.json"
          for f in docs/diagrams/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@12.0.0 -p "$RUNNER_TEMP/puppeteer.json" \
              -c docs/diagrams/mermaid.config.json -b white -i "$f" -o "${f%.mmd}.svg"
          done

      - name: Update README block
        run: node scripts/visual-docs-readme.mjs

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/visual-docs
          delete-branch: true
          add-paths: |
            docs/diagrams/*.svg
            docs/screenshots/*.png
            README.md
          commit-message: 'docs: regenerate diagrams and screenshots'
          title: 'docs: regenerate diagrams and screenshots'
          body: |
            Regenerated by `.github/workflows/visual-docs.yml` after ${{ github.sha }}.
            Review the images, then merge. No code changes.
