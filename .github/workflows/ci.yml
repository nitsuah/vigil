name: CI

on:
  push:
    branches: [main, gh-actions]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ID: ${{ secrets.GITHUB_ID || 'ci-dummy-github-id' }}
          GITHUB_SECRET: ${{ secrets.GITHUB_SECRET || 'ci-dummy-github-secret' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'dummy_nextauth_secret' }}
          CI: true

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ID: ${{ secrets.GITHUB_ID || 'ci-dummy-github-id' }}
          GITHUB_SECRET: ${{ secrets.GITHUB_SECRET || 'ci-dummy-github-secret' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'dummy_nextauth_secret' }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
