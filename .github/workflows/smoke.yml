name: Post-deploy smoke

# After every merge to main, wait for Cloudflare Workers Builds to publish THAT
# commit to vigil.nitsuah.io (OpenNext Worker `gh-vigil`, see wrangler.jsonc), then run a
# signed-out smoke test against the live site. Catches the class of failure the
# unit tests can't: a deploy that builds green but is broken in production
# (e.g. expanding a repo row crashing the whole page).
#
# A red run here means production is broken -- check the deploy, don't ignore it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://vigil.nitsuah.io

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          # The deploy-skip decision diffs the pushed commit range, so fetch
          # history.
          fetch-depth: 0

      - name: Check whether this commit needs a deploy
        id: deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # Manual runs are explicit requests to smoke-test the current site.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A new branch / unavailable base must fail open: run the smoke test.
          if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BEFORE_SHA" "$EXPECTED_SHA") || {
            echo "::warning::Could not determine changed paths; running smoke test."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "$changed" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Paths that cannot change what the Worker serves. Keep this list
          # aligned with the Workers Builds "Build watch paths" exclusions for
          # gh-vigil (Cloudflare dashboard) and with [context.production].ignore
          # in netlify.toml (rollback only).
          deploy_required=false
          while IFS= read -r path; do
            case "$path" in
              docs|docs/*|tests|tests/*|e2e|e2e/*|promo|promo/*|site|site/*|skills|skills/*|.github|.github/*|.husky|.husky/*|*.md)
                ;;
              *)
                deploy_required=true
                break
                ;;
            esac
          done <<< "$changed"

          echo "required=$deploy_required" >> "$GITHUB_OUTPUT"
          if [ "$deploy_required" = "false" ]; then
            echo "Docs/test-only change: Workers Builds skips it, so no new deploy SHA can become live."
          fi

      - name: Explain skipped deploy smoke
        if: steps.deploy.outputs.required == 'false'
        run: |
          {
            echo "### Production smoke skipped"
            echo
            echo "This commit only changes paths excluded from Workers Builds (see the list in this workflow), so no deploy is expected."
            echo "No production deploy is expected, so polling `/api/version` for this commit would time out by design."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the deploy of this commit
        if: steps.deploy.outputs.required == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          expected="$EXPECTED_SHA"
          echo "Waiting for $SITE_URL/api/version to report $expected"
          body=$(mktemp)
          for attempt in $(seq 1 60); do
            status=$(curl -sS --max-time 15 -o "$body" -w '%{http_code}' "$SITE_URL/api/version" 2>/dev/null || echo 000)
            live=$(sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' "$body")
            echo "attempt $attempt: HTTP $status, live commit = ${live:-<none>}"
            if [ "$live" = "$expected" ]; then
              echo "Deploy is live."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for $expected to be deployed (last seen: ${live:-none}, HTTP $status)"
          if [ "$live" = "dev" ]; then
            echo "::error::The live Worker reports 'dev': it was deployed without a commit SHA, or Workers Builds is not connected to this repo, so merges never deploy. See #353."
          fi
          exit 1

      - name: Setup Node.js
        if: steps.deploy.outputs.required == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.deploy.outputs.required == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.deploy.outputs.required == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        if: steps.deploy.outputs.required == 'true'
        run: npx playwright test -c playwright.smoke.config.ts
        env:
          CI: true
          SMOKE_URL: ${{ env.SITE_URL }}

      - name: Upload Playwright report
        if: failure() && steps.deploy.outputs.required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
