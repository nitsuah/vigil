<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020617; font-family: Inter, sans-serif; color: #e2e8f0; }
  #bg { position: absolute; inset: 0;
    background:
      radial-gradient(900px 600px at 20% 30%, rgba(128,45,255,0.16), transparent 70%),
      radial-gradient(800px 600px at 85% 75%, rgba(59,0,128,0.18), transparent 70%),
      #020617; }
  .layer { position: absolute; inset: 0; opacity: 0; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .grad { background: linear-gradient(90deg, #a5b4fc, #d8b4fe 55%, #f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .head { position: absolute; left: 0; right: 0; top: 72px; text-align: center; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; }
  .shot { position: absolute; border-radius: 18px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08); background: #020617; }
  .shot img { display: block; width: 100%; }
  /* s1 */
  #chips { position: absolute; left: 50%; top: 190px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(5, 300px); gap: 18px; }
  .chip { height: 76px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.10); background: rgba(15,23,42,0.85); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 26px; font-weight: 600; color: #cbd5e1; }
  .chip b { font-size: 30px; font-weight: 900; }
  #count { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font-size: 38px; color: #94a3b8; font-weight: 500; }
  #count em { font-style: normal; color: #e2e8f0; font-weight: 700; }
  #count .bad { color: #f87171; }
  #question { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font-size: 104px; font-weight: 900; letter-spacing: -0.03em; }
  .caret { display: inline-block; width: 6px; height: 0.9em; background: #d8b4fe; vertical-align: -0.08em; margin-left: 6px; }
  /* brand */
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand svg { color: #a5b4fc; filter: drop-shadow(0 0 18px rgba(168,85,247,0.55)); }
  .brand span { font-weight: 800; letter-spacing: -0.02em; }
  /* s2 */
  #s2left { position: absolute; left: 110px; top: 330px; width: 640px; }
  #s2left .line { font-size: 58px; font-weight: 800; line-height: 1.12; letter-spacing: -0.02em; margin-top: 40px; }
  #s2shot { left: 770px; top: 230px; width: 1060px; transform-origin: 50% 50%; }
  #stage2 { position: absolute; inset: 0; perspective: 1800px; }
  /* s3/s4 */
  #s3shot { left: 80px; top: 230px; width: 1760px; height: 640px; }
  #s3shot img { width: 2483px; max-width: none; }
  #s4shot { left: 40px; top: 210px; width: 1840px; }
  .cursor { position: absolute; width: 38px; height: 38px; pointer-events: none; }
  .ring { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #d8b4fe; opacity: 0; }
  #confirmPill { position: absolute; padding: 8px 18px; border-radius: 999px; background: rgba(16,185,129,0.18); border: 1px solid rgba(52,211,153,0.6); color: #6ee7b7; font-weight: 700; font-size: 24px; opacity: 0; }
  /* s5 */
  #term { position: absolute; left: 260px; top: 250px; width: 1400px; height: 540px; border-radius: 18px; background: #0b1020; box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08); font-family: 'JetBrains Mono', monospace; font-size: 30px; padding: 70px 56px 40px; overflow: hidden; }
  #term .bar { position: absolute; left: 0; right: 0; top: 0; height: 46px; background: rgba(255,255,255,0.04); display: flex; align-items: center; gap: 10px; padding-left: 20px; }
  #term .bar i { width: 14px; height: 14px; border-radius: 50%; background: #334155; display: block; }
  #term .bar span { margin-left: 16px; font-size: 18px; color: #64748b; font-family: Inter, sans-serif; }
  .tl { white-space: pre; line-height: 1.55; opacity: 0; }
  .p0 { color: #f87171; font-weight: 600; } .p1 { color: #fbbf24; font-weight: 600; }
  .dim { color: #64748b; } .tool { color: #a5b4fc; } .you { color: #e2e8f0; } .ok { color: #6ee7b7; }
  /* s6 */
  #s6 .brand span { font-size: 150px; }
  #s6 .tag { font-size: 58px; font-weight: 700; margin-top: 30px; }
  #s6 .chips { display: flex; gap: 20px; margin-top: 56px; }
  #s6 .chips div { font-family: 'JetBrains Mono', monospace; font-size: 30px; padding: 14px 26px; border-radius: 12px; background: rgba(15,23,42,0.9); border: 1px solid rgba(165,180,252,0.3); color: #c7d2fe; }
</style>
</head>
<body>
<div id="bg"></div>

<div id="s1" class="layer">
  <div id="chips"></div>
  <div id="count"></div>
  <div id="question"><span class="grad" id="qtext"></span><span class="caret" id="qcaret"></span></div>
</div>

<div id="s2" class="layer">
  <div id="s2left">
    <div class="brand" id="s2brand"></div>
    <div class="line"><span class="grad">Every repo, graded.</span><br />One dashboard.</div>
  </div>
  <div id="stage2"><div class="shot" id="s2shot"><img src="crops/dashboard.png" /></div></div>
</div>

<div id="s3" class="layer">
  <div class="head">Open work. <span class="grad">Most urgent first.</span></div>
  <div class="shot" id="s3shot"><img id="s3a" src="crops/pmo-p01.png" /><img id="s3b" src="crops/pmo-p012.png" style="position:absolute;left:0;top:0" /></div>
  <div class="ring" id="ring3"></div>
  <svg class="cursor" id="cur3" viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.5L9.5 21z" fill="#fff" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div>

<div id="s4" class="layer">
  <div class="head">Which repo uses which. <span class="grad">And why.</span></div>
  <div class="shot" id="s4shot"><img src="crops/relationships.png" /></div>
  <div id="confirmPill">✓ Confirmed</div>
  <div class="ring" id="ring4"></div>
  <svg class="cursor" id="cur4" viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.5L9.5 21z" fill="#fff" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div>

<div id="s5" class="layer">
  <div class="head">Your agents <span class="grad">read it too.</span></div>
  <div id="term"><div class="bar"><i></i><i></i><i></i><span>claude — vigil MCP</span></div><div id="tlines"></div></div>
</div>

<div id="s6" class="layer center">
  <div class="brand" id="s6brand"></div>
  <div class="tag">Keep watch over <span class="grad">every repo.</span></div>
  <div class="chips"><div>github.com/nitsuah/vigil</div><div>MCP for Claude Code</div></div>
</div>

<script>
const P = window.PROMO, S = window.SPOT;
const ICON = (px) => `<svg width="${px}" height="${px}" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="3.5" x2="12" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="20.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="3.5" y1="12" x2="7" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="17" y1="12" x2="20.5" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>`;
document.getElementById('s2brand').innerHTML = ICON(100) + '<span class="grad" style="font-size:110px">Vigil</span>';
document.getElementById('s6brand').innerHTML = ICON(170) + '<span class="grad">Vigil</span>';

const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const grade = (h) => (h >= 95 ? 'A+' : h >= 90 ? 'A' : h >= 80 ? 'B' : h >= 70 ? 'C' : h >= 60 ? 'D' : 'F');
const gcol = (h) => (h >= 90 ? '#34d399' : h >= 80 ? '#60a5fa' : h >= 70 ? '#facc15' : h >= 60 ? '#fb923c' : '#f87171');

// Scene windows: fade out over the last 0.3s, next fades in over 0.35s (dip through bg, no double exposure).
function sceneAlpha(t, a, b, first, last) {
  const fin = first ? 1 : prog(t, a, a + 0.35);
  const fout = last ? 1 : 1 - prog(t, b - 0.3, b);
  return t < a || t > b ? 0 : Math.min(fin, fout);
}

// s1 content
const chipEls = P.repos.map((r) => {
  const d = document.createElement('div');
  d.className = 'chip';
  d.innerHTML = `<span>${r.name}</span><b style="color:${gcol(r.health)}">${grade(r.health)}</b>`;
  $('chips').appendChild(d);
  return d;
});
const N = P.hook, H = S.hook; // N: numbers from the capture, H: timings from spot.json
$('count').innerHTML = `<em>${N.repos} repos</em> · <em>${N.openTasks} open tasks</em> · <em class="bad">${N.failingCi} failing build</em>`;

// s5 content
const pad = (s, n) => (s + ' '.repeat(n)).slice(0, n);
const m = P.mcp;
const lines = [
  { at: S.questionAt, html: '<span class="dim">&gt; </span><span class="you" data-type></span>' },
  { at: S.toolAt, html: `<span class="tool">● vigil · get_open_tasks</span><span class="dim">(priority: ["P0", "P1"])</span>` },
  { at: S.resultAt, html: `<span class="dim">  ⎿ </span><span class="ok">${m.total} open</span><span class="dim"> · P0 ${m.by_priority.P0} · P1 ${m.by_priority.P1}</span>` },
  ...m.tasks.map((x, i) => ({
    at: S.resultAt + 0.3 + i * 0.28,
    html: `<span class="dim">    </span><span class="${x.priority.toLowerCase()}">${x.priority}</span>  <span class="you">${pad(x.repo, 13)}</span> <span class="dim">${x.title}</span>`,
  })),
];
const lineEls = lines.map((l) => { const d = document.createElement('div'); d.className = 'tl'; d.innerHTML = l.html; $('tlines').appendChild(d); return d; });
const typeEl = lineEls[0].querySelector('[data-type]');

// Cursor targets (CSS px of the crops → on-screen px).
const s3scale = 2483 / 1552; // PMO grid shown at 1.6x inside a 1760x640 window
const p2 = P.p2Chip ? { x: 80 + P.p2Chip.x * s3scale, y: 230 + P.p2Chip.y * s3scale } : { x: 520, y: 270 };
const s4scale = 1840 / 1552;
const check = { x: 40 + 1502 * s4scale, y: 210 + 75 * s4scale };

function cursorPath(el, ring, t, t0, from, to, clickAt) {
  const k = eInOut(prog(t, t0, clickAt - 0.1));
  const x = lerp(from.x, to.x, k), y = lerp(from.y, to.y, k);
  const press = 1 - 0.18 * Math.sin(Math.PI * prog(t, clickAt - 0.05, clickAt + 0.15));
  el.style.transform = `translate(${x - 6}px, ${y - 4}px) scale(${press})`;
  const r = prog(t, clickAt, clickAt + 0.5);
  ring.style.opacity = r > 0 && r < 1 ? 1 - r : 0;
  ring.style.transform = `translate(${to.x - 30}px, ${to.y - 30}px) scale(${0.4 + r * 1.2})`;
}

window.render = (t) => {
  const [a1, a2, a3, a4, a5, a6] = S.scenes.map(([, a, b], i) => sceneAlpha(t, a, b, i === 0, i === S.scenes.length - 1));
  $('s1').style.opacity = a1; $('s2').style.opacity = a2; $('s3').style.opacity = a3;
  $('s4').style.opacity = a4; $('s5').style.opacity = a5; $('s6').style.opacity = a6;

  // s1: chips pop, count lands, question types
  chipEls.forEach((c, i) => {
    const k = prog(t, H.chipsStart + i * H.chipGap, H.chipsStart + i * H.chipGap + 0.35);
    c.style.opacity = k;
    c.style.transform = `translateY(${(1 - eOut(k)) * 30}px) scale(${lerp(0.8, 1, eBack(k))})`;
  });
  const ck = prog(t, H.countAt, H.countAt + 0.3);
  $('count').style.opacity = ck; $('count').style.transform = `translateY(${(1 - eOut(ck)) * 16}px)`;
  const q = 'What do I work on next?';
  const nq = clamp(Math.floor((t - H.typeAt) * H.typeCps), 0, q.length);
  $('qtext').textContent = q.slice(0, nq);
  $('qcaret').style.opacity = t < H.typeAt ? 0 : (nq < q.length || Math.floor(t * 2.5) % 2 === 0 ? 1 : 0);

  // s2: brand + line, dashboard swings in
  const b2 = eOut(prog(t, 3.1, 3.7));
  $('s2left').style.transform = `translateX(${(1 - b2) * -40}px)`; $('s2left').style.opacity = b2;
  const d2 = eOut(prog(t, 3.3, 4.4));
  const drift = prog(t, 4.4, 7);
  $('s2shot').style.transform = `rotateY(${lerp(34, -7, d2) - drift * 2}deg) translateX(${(1 - d2) * 260}px) scale(${lerp(0.9, 1, d2) + drift * 0.02})`;
  $('s2shot').style.opacity = d2;

  // s3: grid rises in, cursor clicks P2, fuller grid replaces it
  const g3 = eOut(prog(t, 7.1, 7.7));
  $('s3shot').style.transform = `translateY(${(1 - g3) * 50}px)`;
  $('s3b').style.opacity = prog(t, S.clicks.p2 + 0.05, S.clicks.p2 + 0.35);
  cursorPath($('cur3'), $('ring3'), t, 7.9, { x: 1500, y: 980 }, p2, S.clicks.p2);
  $('cur3').style.opacity = prog(t, 7.7, 8.0);

  // s4: map rises in, cursor confirms the agent's edge
  const g4 = eOut(prog(t, 11.1, 11.7));
  $('s4shot').style.transform = `translateY(${(1 - g4) * 50}px)`;
  cursorPath($('cur4'), $('ring4'), t, 12.3, { x: 1200, y: 980 }, check, S.clicks.confirm);
  $('cur4').style.opacity = prog(t, 12.1, 12.4);
  const cp = prog(t, S.clicks.confirm + 0.05, S.clicks.confirm + 0.35);
  $('confirmPill').style.opacity = cp;
  $('confirmPill').style.transform = `translate(${check.x - 250}px, ${check.y - 22}px) scale(${lerp(0.7, 1, eBack(cp))})`;

  // s5: terminal
  const tm = eOut(prog(t, 15.05, 15.5));
  $('term').style.transform = `translateY(${(1 - tm) * 40}px)`;
  const typed = clamp(Math.floor((t - S.questionAt - 0.1) * 34), 0, S.question.length);
  typeEl.textContent = S.question.slice(0, typed);
  lineEls.forEach((el, i) => {
    const k = prog(t, lines[i].at, lines[i].at + 0.2);
    el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 8}px)`;
  });

  // s6: outro
  const o1 = eBack(prog(t, 18.6, 19.2));
  $('s6brand').style.transform = `scale(${lerp(0.85, 1, o1)})`; $('s6brand').style.opacity = prog(t, 18.6, 18.9);
  const o2 = prog(t, 19.1, 19.5); document.querySelector('#s6 .tag').style.opacity = o2;
  const o3 = prog(t, 19.6, 20.0); document.querySelector('#s6 .chips').style.opacity = o3;
  document.querySelector('#s6 .chips').style.transform = `translateY(${(1 - eOut(o3)) * 14}px)`;
};

window.ready = (async () => {
  await Promise.all(['500 20px Inter', '600 20px Inter', '700 20px Inter', '800 20px Inter', '900 20px Inter', '400 20px "JetBrains Mono"', '600 20px "JetBrains Mono"'].map((f) => document.fonts.load(f)));
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => (i.complete ? null : new Promise((r) => { i.onload = r; i.onerror = r; }))));
  window.render(0);
})();
</script>
</body>
</html>
