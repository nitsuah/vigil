# Rollback path only -- see the note above [context.production].
[build]
  command = "npm run test-gemini-health || true && npm run build"
  publish = ".next"
  ignore = "exit 0"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"

# ROLLBACK ONLY: production is served by Cloudflare Workers (wrangler.jsonc); the
# Netlify site no longer serves vigil.nitsuah.io.
# All Netlify builds are skipped (`ignore = "exit 0"` under [build] and here) so
# they do not burn Free-plan credits after the team downgrade. Deploy previews
# are skipped too. To restore the previous selective production skip, use:
# ignore = "test -n \"$CACHED_COMMIT_REF\" && test -n \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)docs' ':(exclude)tests' ':(exclude)e2e' ':(exclude)promo' ':(exclude)site' ':(exclude)skills' ':(exclude).github' ':(exclude).husky' ':(exclude)*.md'"
[context.production]
  ignore = "exit 0"
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/auth/*"
  to = "/api/auth/:splat"
  status = 200

## NOTE:
## Previously we redirected all /api/* paths to Netlify Functions.
## This broke Next.js App Router API routes like /api/repos by sending
## them to non-existent functions (404). It also caused /api/sync-repos
## to hit the function but fail with 500 when GITHUB_TOKEN was missing.
## We now use the Next.js API route for /api/sync-repos instead of a
## Netlify function, as it properly handles user authentication.

## [[redirects]]
##   from = "/api/sync-repos"
##   to = "/.netlify/functions/sync-repos"
##   status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Images may only load from this origin and the hosts rendered markdown is
    # allowed to show (keep in sync with ALLOWED_IMAGE_HOSTS in lib/safe-image.ts).
    Content-Security-Policy = "img-src 'self' data: blob: https://img.shields.io https://github.com https://raw.githubusercontent.com https://*.githubusercontent.com https://api.netlify.com https://codecov.io"
