[build]
  command = "npm run test-gemini-health || true && npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"

# Every production deploy costs Netlify credits, so skip the ones that cannot change
# what is served (docs, tests, CI config, promo assets). Exit 0 = no relevant changes =
# skip; a missing CACHED_COMMIT_REF makes git exit non-zero, so it fails open.
# Production only: deploy previews are free and stay on for review.
[context.production]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)tests' ':(exclude)e2e' ':(exclude)promo' ':(exclude)site' ':(exclude)skills' ':(exclude).github' ':(exclude).husky' ':(exclude)*.md'"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/auth/*"
  to = "/api/auth/:splat"
  status = 200

## NOTE:
## Previously we redirected all /api/* paths to Netlify Functions.
## This broke Next.js App Router API routes like /api/repos by sending
## them to non-existent functions (404). It also caused /api/sync-repos
## to hit the function but fail with 500 when GITHUB_TOKEN was missing.
## We now use the Next.js API route for /api/sync-repos instead of a
## Netlify function, as it properly handles user authentication.

## [[redirects]]
##   from = "/api/sync-repos"
##   to = "/.netlify/functions/sync-repos"
##   status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
